# Bruges af Cloudflare Workers Builds: hver gang der skubbes til main, deployes cloudflare-worker.js automatisk.
# Hemmeligheder (DASH_KEY, SONOS_CLIENT_SECRET) og andre variabler ligger i Cloudflare og bevares (keep_vars).
name = "easyhome"
main = "cloudflare-worker.js"
compatibility_date = "2026-11-01"
keep_vars = true
workers_dev = true

[[kv_namespaces]]
binding = "DASH_KV"
id = "30dd953792944a66b82b70120bff7838"
